workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      groups:
        - ios_credentials
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.onadsgroup.auraapp
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: codemagic_api_key
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Flutter build iOS
        script: flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Build and export IPA
        script: |
          sed -i '' '/alwaysOutOfDate = 1;/d' ios/Runner.xcodeproj/project.pbxproj

          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "ENABLE_USER_SCRIPT_SANDBOXING=NO COMPILER_INDEX_STORE_ENABLE=NO"

      # Crashlytics can only symbolicate iOS crashes with the build's dSYMs.
      # Never fails the build: a missing dSYM or upload error just means that
      # release's iOS crashes show unsymbolicated addresses (ADR 029).
      - name: Upload dSYMs to Crashlytics
        ignore_failure: true
        script: |
          UPLOADER=ios/Pods/FirebaseCrashlytics/upload-symbols
          if [ ! -x "$UPLOADER" ]; then echo "upload-symbols not found, skipping"; exit 0; fi
          found=0
          while IFS= read -r dsym; do
            found=1
            echo "Uploading $dsym"
            "$UPLOADER" -gsp ios/Runner/GoogleService-Info.plist -p ios "$dsym"
          done < <(find "$CM_BUILD_DIR/build" -name "*.dSYM" -type d)
          [ "$found" = 1 ] || echo "No dSYMs found, skipping"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

  ios-prototype:
    name: iOS TestFlight - Prototype
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: prototype
          include: true
    environment:
      groups:
        - ios_credentials
        - ios_prototype_credentials
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.onadsgroup.auraapp.prototype
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: codemagic_api_key
    scripts:
      - name: Patch bundle ID and app name
        script: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.onadsgroup.auraapp;/PRODUCT_BUNDLE_IDENTIFIER = com.onadsgroup.auraapp.prototype;/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Aura Arena Prototype'" ios/Runner/Info.plist

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Flutter build iOS
        script: flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Build and export IPA
        script: |
          python3 -c "f='ios/Runner.xcodeproj/project.pbxproj'; c=open(f).read(); n=c.count('alwaysOutOfDate = 1;'); open(f,'w').write(c.replace('alwaysOutOfDate = 1;','')); print('Removed', n, 'occurrences of alwaysOutOfDate = 1;')"

          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "ENABLE_USER_SCRIPT_SANDBOXING=NO COMPILER_INDEX_STORE_ENABLE=NO"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

  android-playstore:
    name: Android Play Store
    max_build_duration: 60
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.onadsgroup.auraapp"
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Write release keystore and key.properties
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/upload-keystore.jks
          cat > "$CM_BUILD_DIR/android/key.properties" <<KEYPROPS
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/upload-keystore.jks
          KEYPROPS

      - name: Flutter build appbundle
        script: flutter build appbundle --release --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

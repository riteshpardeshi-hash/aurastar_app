name: aura_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+15

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.0
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.5.0
  firebase_messaging: ^15.2.0
  video_player: ^2.8.2
  firebase_storage: ^12.4.0
  path: ^1.9.0
  video_thumbnail: ^0.5.3
  image_picker: ^1.1.2
  share_plus: ^10.0.0
  app_links: ^6.0.0
  shared_preferences: ^2.3.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.0
  url_launcher: ^6.3.0
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4
  permission_handler: ^11.3.1
  # Android SMS Retriever + User Consent APIs — auto-reads the login OTP from
  # the Message Central SMS (see docs/decisions/004). Android-only; no-ops on iOS.
  smart_auth: ^3.2.0
  path_provider: ^2.1.5
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  video_player_platform_interface: ^6.2.0
  path_provider_platform_interface: ^2.1.2
  camera_platform_interface: ^2.11.0
  permission_handler_platform_interface: ^4.2.0

flutter:
  uses-material-design: true

  assets:
